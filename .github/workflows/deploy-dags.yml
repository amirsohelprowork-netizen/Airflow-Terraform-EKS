####################################################
# GitHub Actions: Deploy DAGs to Airflow EC2
# Triggers on push to main when dags/ or requirements/ change
####################################################

name: Deploy DAGs to Airflow

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'requirements/**'
  pull_request:
    branches: [main]
    paths:
      - 'dags/**'
      - 'requirements/**'

permissions:
  contents: read

jobs:
  # -------- Step 1: Validate DAGs --------
  validate:
    name: Validate DAGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Airflow for validation
        run: |
          pip install apache-airflow==2.9.2 --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.2/constraints-3.11.txt"
          if [ -f requirements/requirements.txt ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Validate DAG syntax
        run: python scripts/validate_dags.py

  # -------- Step 2: Deploy via SSH (only on main) --------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy DAGs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AIRFLOW_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Deploying DAGs..."
            # Clean old DAGs
            sudo rm -rf /opt/airflow/dags/*

      - name: Copy DAGs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AIRFLOW_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dags/*"
          target: "/opt/airflow/"
          strip_components: 0

      - name: Fix permissions & verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AIRFLOW_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo chown -R 50000:0 /opt/airflow/dags/
            echo "✅ DAGs deployed! Files:"
            ls -la /opt/airflow/dags/
            echo ""
            echo "Airflow scheduler will pick up changes within ~30 seconds."

      - name: Summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| DAGs | ✅ Deployed via SSH |" >> $GITHUB_STEP_SUMMARY
          echo "| Host | \`${{ secrets.AIRFLOW_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Airflow will pick up changes within ~30 seconds." >> $GITHUB_STEP_SUMMARY
