name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_kubernetes_version: ${{ vars.TF_VAR_KUBERNETES_VERSION }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_terraform_lock_table: ${{ vars.TF_LOCK_TABLE }}
  TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
  TF_VAR_budget_limit_usd: ${{ vars.BUDGET_LIMIT_USD || '40' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'airflow-demo/terraform.tfstate' }}

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required GitHub configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          require_var() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Actions variable or secret: $name"
              echo "Run ./scripts/bootstrap.sh --email you@example.com (or bootstrap.ps1) on your fork."
              missing=1
            fi
          }
          require_var AWS_REGION "${{ vars.AWS_REGION }}"
          require_var AWS_ACCOUNT_ID "${{ vars.AWS_ACCOUNT_ID }}"
          require_var TF_STATE_BUCKET "${{ vars.TF_STATE_BUCKET }}"
          require_var TF_LOCK_TABLE "${{ vars.TF_LOCK_TABLE }}"
          require_var TF_VAR_KUBERNETES_VERSION "${{ vars.TF_VAR_KUBERNETES_VERSION }}"
          require_var AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
          require_var AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
          if [ -z "${{ vars.BUDGET_ALERT_EMAIL }}" ]; then
            echo "::warning::BUDGET_ALERT_EMAIL is empty — no AWS Budget will be created. Set it to avoid surprise charges."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Preflight OK"

      - name: Normalize admin CIDR list for Terraform
        env:
          RAW_CIDRS: ${{ vars.TF_VAR_ADMIN_CIDR_BLOCKS }}
        run: |
          # Terraform list(string) via TF_VAR_ must be JSON, e.g. ["0.0.0.0/0"].
          # Accept bare 0.0.0.0/0 from GitHub variables and wrap it.
          cidr="${RAW_CIDRS:-["0.0.0.0/0"]}"
          if [[ "$cidr" != \[* ]]; then
            cidr="[\"${cidr}\"]"
          fi
          echo "TF_VAR_admin_cidr_blocks=${cidr}" >> "$GITHUB_ENV"
          echo "Using admin_cidr_blocks=${cidr}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Next steps summary
        working-directory: ./terraform
        run: |
          ROLE_ARN="$(terraform output -raw github_deploy_role_arn)"
          {
            echo "## Infrastructure deploy succeeded"
            echo ""
            echo "1. (Optional) Set repository variable \`GITHUB_DEPLOY_ROLE_ARN\` to:"
            echo "   \`$ROLE_ARN\`"
            echo "2. Run workflow **Deploy Airflow to EKS**."
            echo "3. Open the UI with \`./scripts/open-airflow.sh\` or \`open-airflow.ps1\`."
            echo "4. When finished, run **Destroy Demo Stack** (type \`destroy\`)."
            echo ""
            echo "### Demo capacity"
            echo '```json'
            terraform output -json demo_capacity_summary
            echo '```'
            echo ""
            echo "If Airflow deploy fails on OIDC, see [docs/TROUBLESHOOTING.md](../docs/TROUBLESHOOTING.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Set GitHub variable GITHUB_DEPLOY_ROLE_ARN to: $ROLE_ARN"
