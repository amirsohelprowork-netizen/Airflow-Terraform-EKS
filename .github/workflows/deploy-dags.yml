####################################################
# GitHub Actions: Deploy DAGs to MWAA
# Triggers on push to main when dags/ or requirements/ change
####################################################

name: Deploy DAGs to MWAA

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'requirements/**'
  pull_request:
    branches: [main]
    paths:
      - 'dags/**'
      - 'requirements/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  MWAA_S3_BUCKET: ${{ secrets.MWAA_S3_BUCKET }}

permissions:
  contents: read

jobs:
  # -------- Step 1: Validate DAGs --------
  validate:
    name: Validate DAGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install apache-airflow==2.9.2 --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.2/constraints-3.11.txt"
          if [ -f requirements/requirements.txt ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Validate DAG syntax
        run: python scripts/validate_dags.py

  # -------- Step 2: Deploy to S3 (only on main) --------
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync DAGs to S3
        run: |
          echo "🚀 Syncing DAGs to s3://${MWAA_S3_BUCKET}/dags/"
          aws s3 sync dags/ s3://${MWAA_S3_BUCKET}/dags/ \
            --delete \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".DS_Store"
          echo "✅ DAGs synced successfully!"

      - name: Sync requirements to S3
        run: |
          echo "📦 Uploading requirements.txt"
          aws s3 cp requirements/requirements.txt \
            s3://${MWAA_S3_BUCKET}/requirements/requirements.txt
          echo "✅ Requirements uploaded!"

      - name: Summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| DAGs | ✅ Synced to S3 |" >> $GITHUB_STEP_SUMMARY
          echo "| Requirements | ✅ Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket | \`${MWAA_S3_BUCKET}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${AWS_REGION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MWAA will pick up changes within ~30 seconds." >> $GITHUB_STEP_SUMMARY
