# Enterprise-demo values for the official Apache Airflow Helm chart.
# CI replaces the image repository/tag and applies a generated metadata secret.
executor: KubernetesExecutor

# Static Webserver Secret Key to prevent dynamic key warnings and webserver restarts
webserverSecretKey: "AirflowEnterpriseStaticWebserverSecretKey2026!"

images:
  airflow:
    repository: apache/airflow
    tag: 2.10.5
    pullPolicy: IfNotPresent

postgresql:
  enabled: false

data:
  # Created by scripts/bootstrap-airflow-secrets.ps1. Secret key: connection.
  metadataSecretName: airflow-metadata

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

webserver:
  replicas: 2
  service:
    type: ClusterIP

ingress:
  web:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    hosts:
      - name: "a90d01a85191f4c7882fe9b66c0ab5c7-232742411.us-east-1.elb.amazonaws.com"

scheduler:
  replicas: 2

logs:
  persistence:
    enabled: false

config:
  core:
    load_examples: "False"
    parallelism: "500"
    max_active_runs_per_dag: "4"
  scheduler:
    parsing_processes: "4"
    max_tis_per_query: "256"
  logging:
    remote_logging: "True"
    remote_log_conn_id: "aws_default"

env:
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: s3://airflow-enterprise-demo-airflow-20260726152206799300000005/logs
  - name: AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE
    value: airflow

# Keep control-plane services on resilient on-demand nodes. Task pods are
# configured separately by a pod template to use the worker node group.
nodeSelector:
  workload: airflow-system

workers:
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
