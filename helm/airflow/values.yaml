# =============================================================================
# Apache Airflow 3.2.2 — Free Tier / credit-capped demo Helm values
# Helm chart: apache-airflow/airflow v1.22.0
# Control plane runs on m7i-flex.large system nodes (not t3.micro).
# =============================================================================

executor: KubernetesExecutor
airflowVersion: "3.2.2"

# Supply via GitHub secret + --set-string in CI. Never commit a real key.
apiSecretKey: "CHANGE-ME-BEFORE-PRODUCTION"

images:
  airflow:
    repository: apache/airflow
    tag: 3.2.2
    pullPolicy: IfNotPresent

postgresql:
  enabled: false

data:
  metadataSecretName: airflow-metadata

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

apiServer:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

createUserJob:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    password: CHANGE-ME
    email: admin@example.com
    firstName: Admin
    lastName: User

ingress:
  web:
    enabled: false
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    host: ""
  apiServer:
    enabled: false
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    host: ""

scheduler:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1536Mi }

triggerer:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 768Mi }

statsd:
  resources:
    requests: { cpu: 20m,  memory: 32Mi }
    limits:   { memory: 64Mi }

dagProcessor:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 768Mi }

logs:
  persistence:
    enabled: false

config:
  core:
    load_examples: "False"
    parallelism: "16"
    max_active_runs_per_dag: "2"
  scheduler:
    parsing_processes: "2"
    max_tis_per_query: "128"
  logging:
    remote_logging: "True"
    remote_log_conn_id: "aws_default"
  api:
    expose_config: "False"
    instance_name: "Enterprise Airflow Demo"

env:
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: "s3://REPLACED-AT-DEPLOY-TIME/logs"
  - name: AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE
    value: airflow

# IRSA annotations are injected by the Deploy Airflow GitHub Actions workflow.

nodeSelector:
  workload: airflow-system

workers:
  nodeSelector:
    workload: airflow-task
  tolerations:
    - key: workload
      operator: Equal
      value: airflow-task
      effect: NoSchedule
  resources:
    # Sized for Free Tier-eligible t3.small workers (2 GiB).
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 768Mi }
