name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_kubernetes_version: ${{ vars.TF_VAR_KUBERNETES_VERSION }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_terraform_lock_table: ${{ vars.TF_LOCK_TABLE }}
  TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
  TF_VAR_budget_limit_usd: ${{ vars.BUDGET_LIMIT_USD || '40' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'airflow-demo/terraform.tfstate' }}

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Normalize admin CIDR list for Terraform
        env:
          RAW_CIDRS: ${{ vars.TF_VAR_ADMIN_CIDR_BLOCKS }}
        run: |
          # Terraform list(string) via TF_VAR_ must be JSON, e.g. ["0.0.0.0/0"].
          # Accept bare 0.0.0.0/0 from GitHub variables and wrap it.
          cidr="${RAW_CIDRS:-["0.0.0.0/0"]}"
          if [[ "$cidr" != \[* ]]; then
            cidr="[\"${cidr}\"]"
          fi
          echo "TF_VAR_admin_cidr_blocks=${cidr}" >> "$GITHUB_ENV"
          echo "Using admin_cidr_blocks=${cidr}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Publish deploy role for application pipeline
        working-directory: ./terraform
        run: |
          echo "Set GitHub variable GITHUB_DEPLOY_ROLE_ARN to:"
          terraform output -raw github_deploy_role_arn
          echo ""
          echo "Demo capacity:"
          terraform output -json demo_capacity_summary
