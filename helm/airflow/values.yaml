# =============================================================================
# Apache Airflow 2.10.5 — Production-Grade Enterprise Helm Values
# Helm Chart: apache-airflow/airflow v1.16.0
# =============================================================================

executor: KubernetesExecutor

# ── Static Webserver Secret Key ──────────────────────────────────────────────
# Prevents the dynamic-key warning and unnecessary webserver restarts.
webserverSecretKey: "AirflowEnterpriseStaticWebserverSecretKey2026!"

# ── Airflow Image ────────────────────────────────────────────────────────────
images:
  airflow:
    repository: apache/airflow
    tag: 3.2.2
    pullPolicy: IfNotPresent

# ── External RDS PostgreSQL (no in-cluster Postgres) ─────────────────────────
postgresql:
  enabled: false

data:
  metadataSecretName: airflow-metadata   # created by bootstrap-airflow-secrets.ps1

# ── DAGs ─────────────────────────────────────────────────────────────────────
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# ── Webserver ────────────────────────────────────────────────────────────────
webserver:
  replicas: 1                            # single replica is fine for demo
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi   }
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    password: admin
    email: admin@example.com
    firstName: Admin
    lastName: User

# ── Ingress via NGINX Ingress Controller (HTTPS) ────────────────────────────
ingress:
  web:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    host: ""                             # accept any hostname
  apiServer:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    host: ""                             # accept any hostname

# ── Scheduler ────────────────────────────────────────────────────────────────
scheduler:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi   }

# ── Triggerer ────────────────────────────────────────────────────────────────
triggerer:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi   }

# ── StatsD ───────────────────────────────────────────────────────────────────
statsd:
  resources:
    requests: { cpu: 50m,  memory: 64Mi  }
    limits:   { cpu: 200m, memory: 256Mi }

# ── Logs ─────────────────────────────────────────────────────────────────────
logs:
  persistence:
    enabled: false

# ── Airflow Configuration Overrides ──────────────────────────────────────────
config:
  core:
    load_examples: "False"
    parallelism: "32"
    max_active_runs_per_dag: "4"
  scheduler:
    parsing_processes: "2"
    max_tis_per_query: "256"
  logging:
    remote_logging: "True"
    remote_log_conn_id: "aws_default"
  webserver:
    expose_config: "True"
    instance_name: "Enterprise Airflow"

# ── Environment Variables ────────────────────────────────────────────────────
env:
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: "s3://REPLACED-AT-DEPLOY-TIME/logs"   # overridden by --set-string in CI/CD pipeline
  - name: AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE
    value: airflow

# Note: IAM Roles for Service Accounts (IRSA) annotations are injected dynamically
# during deployment via `helm upgrade --set` in the GitHub Actions pipeline.

# ── Node Placement ───────────────────────────────────────────────────────────
nodeSelector:
  workload: airflow-system

# ── Worker Pod Resources (KubernetesExecutor task pods) ──────────────────────
workers:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi   }
