# =============================================================================
# Apache Airflow 2.10.5 — Production-Grade Enterprise Helm Values
# Helm Chart: apache-airflow/airflow v1.16.0
# =============================================================================

executor: KubernetesExecutor
airflowVersion: "3.2.2"

# ── Static Webserver Secret Key ──────────────────────────────────────────────
# Prevents the dynamic-key warning and unnecessary webserver restarts.
# Supply this through a Kubernetes Secret or --set-string in the deployment.
# Never commit a real key to this public template.
apiSecretKey: "CHANGE-ME-BEFORE-PRODUCTION"

# ── Airflow Image ────────────────────────────────────────────────────────────
images:
  airflow:
    repository: apache/airflow
    tag: 3.2.2
    pullPolicy: IfNotPresent

# ── External RDS PostgreSQL (no in-cluster Postgres) ─────────────────────────
postgresql:
  enabled: false

data:
  metadataSecretName: airflow-metadata   # created by bootstrap-airflow-secrets.ps1

# ── DAGs ─────────────────────────────────────────────────────────────────────
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# ── Webserver ────────────────────────────────────────────────────────────────
apiServer:
  replicas: 1                            # single replica is fine for demo
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi   }

createUserJob:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    password: CHANGE-ME
    email: admin@example.com
    firstName: Admin
    lastName: User

# ── Ingress via NGINX Ingress Controller (HTTPS) ────────────────────────────
ingress:
  web:
    enabled: false
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    host: ""                             # accept any hostname
  apiServer:
    enabled: false
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    host: ""                             # accept any hostname

# ── Scheduler ────────────────────────────────────────────────────────────────
scheduler:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1024Mi   }

# ── Triggerer ────────────────────────────────────────────────────────────────
triggerer:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi   }

# ── StatsD ───────────────────────────────────────────────────────────────────
statsd:
  resources:
    requests: { cpu: 20m,  memory: 32Mi  }
    limits:   { memory: 64Mi }

# ── DAG Processor ────────────────────────────────────────────────────────────
dagProcessor:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }

# ── Logs ─────────────────────────────────────────────────────────────────────
logs:
  persistence:
    enabled: false

# ── Airflow Configuration Overrides ──────────────────────────────────────────
config:
  core:
    load_examples: "False"
    parallelism: "32"
    max_active_runs_per_dag: "4"
  scheduler:
    parsing_processes: "2"
    max_tis_per_query: "256"
  logging:
    remote_logging: "True"
    remote_log_conn_id: "aws_default"
  api:
    expose_config: "False"
    instance_name: "Enterprise Airflow"

# ── Environment Variables ────────────────────────────────────────────────────
env:
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: "s3://REPLACED-AT-DEPLOY-TIME/logs"   # overridden by --set-string in CI/CD pipeline
  - name: AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE
    value: airflow

# Note: IAM Roles for Service Accounts (IRSA) annotations are injected dynamically
# during deployment via `helm upgrade --set` in the GitHub Actions pipeline.

# ── Node Placement ───────────────────────────────────────────────────────────
nodeSelector:
  workload: airflow-system

# ── Worker Pod Resources (KubernetesExecutor task pods) ──────────────────────
workers:
  # KubernetesExecutor task pods must land on the autoscaled task node group.
  nodeSelector:
    workload: airflow-task
  tolerations:
    - key: workload
      operator: Equal
      value: airflow-task
      effect: NoSchedule
  resources:
    # Kept deliberately small so a short-lived demo can schedule on t3.micro.
    # Production task sizing must be set from measured workload requirements.
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
