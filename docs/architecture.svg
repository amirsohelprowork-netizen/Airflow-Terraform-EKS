<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Apache Airflow 3 on Amazon EKS — Architecture (Demo Profile)</text>
  <text x="700" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Immutable SHA images · KubernetesExecutor · IRSA · GitHub OIDC · cost-capped demo (~10 concurrent tasks)</text>

  <!-- Developer / GitHub -->
  <rect x="80" y="85" width="160" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Developer</text>

  <line x1="240" y1="113" x2="300" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="70" width="320" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="460" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">GitHub Actions</text>
  <rect x="320" y="108" width="130" height="36" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="385" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">1. Deploy Infra</text>
  <rect x="470" y="108" width="130" height="36" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="535" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a">2. Deploy Airflow</text>
  <text x="460" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">IAM keys (infra) · OIDC (app) · Destroy workflow</text>

  <!-- AWS boundary -->
  <rect x="60" y="200" width="1280" height="620" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="80" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">AWS Account</text>

  <!-- VPC -->
  <rect x="90" y="250" width="900" height="480" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="110" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0369a1">Amazon VPC</text>
  <text x="110" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Public: NAT Gateway (single) · Private: EKS nodes + RDS</text>

  <!-- EKS -->
  <rect x="110" y="320" width="860" height="320" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="130" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#14532d">Amazon EKS Cluster</text>

  <!-- System NG -->
  <rect x="130" y="370" width="400" height="250" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1.2"/>
  <text x="330" y="395" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#14532d">System node group</text>
  <text x="330" y="413" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">m7i-flex.large × 2 · workload=airflow-system</text>
  <rect x="150" y="430" width="170" height="40" rx="6" fill="#ecfdf5" stroke="#166534"/><text x="235" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#14532d">Scheduler</text>
  <rect x="340" y="430" width="170" height="40" rx="6" fill="#ecfdf5" stroke="#166534"/><text x="425" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#14532d">API Server</text>
  <rect x="150" y="485" width="170" height="40" rx="6" fill="#ecfdf5" stroke="#166534"/><text x="235" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#14532d">DAG Processor</text>
  <rect x="340" y="485" width="170" height="40" rx="6" fill="#ecfdf5" stroke="#166534"/><text x="425" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#14532d">Triggerer</text>
  <rect x="150" y="540" width="360" height="40" rx="6" fill="#ecfdf5" stroke="#166534"/><text x="330" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#14532d">StatsD</text>

  <!-- Workers -->
  <rect x="550" y="370" width="400" height="250" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="750" y="395" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#92400e">Worker node group</text>
  <text x="750" y="413" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">t3.small · scale 0→2 · KubernetesExecutor tasks</text>
  <rect x="575" y="440" width="110" height="70" rx="6" fill="#fffbeb" stroke="#b45309"/><text x="630" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#92400e">Task Pod</text>
  <rect x="705" y="440" width="110" height="70" rx="6" fill="#fffbeb" stroke="#b45309"/><text x="760" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#92400e">Task Pod</text>
  <rect x="835" y="440" width="90" height="70" rx="6" fill="#fffbeb" stroke="#b45309"/><text x="880" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#92400e">…</text>
  <text x="750" y="555" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Cluster Autoscaler · taint workload=airflow-task</text>
  <text x="750" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">~10 concurrent tasks max (demo)</text>

  <!-- Arrow scheduler to workers -->
  <line x1="530" y1="495" x2="550" y2="495" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="485" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">spawn</text>

  <!-- RDS under VPC -->
  <rect x="110" y="660" width="400" height="50" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="310" y="690" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#581c87">RDS PostgreSQL (db.t3.micro) — metadata</text>

  <!-- Side services -->
  <rect x="1020" y="250" width="290" height="70" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="1165" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#92400e">Amazon ECR</text>
  <text x="1165" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Airflow images · git SHA tags</text>

  <rect x="1020" y="340" width="290" height="70" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.2"/>
  <text x="1165" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0c4a6e">Amazon S3</text>
  <text x="1165" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Remote task logs · IRSA</text>

  <rect x="1020" y="430" width="290" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="1165" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">IAM</text>
  <text x="1165" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">GitHub OIDC deploy role</text>
  <text x="1165" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Airflow IRSA · Autoscaler IRSA</text>

  <rect x="1020" y="540" width="290" height="70" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="1165" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#14532d">Secrets Manager</text>
  <text x="1165" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">RDS password → K8s secret (URL-encoded)</text>

  <!-- connections from GitHub -->
  <line x1="460" y1="160" x2="460" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="144" x2="1165" y2="250" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="900" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">push image</text>

  <line x1="970" y1="480" x2="1020" y2="375" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="510" y1="640" x2="510" y2="660" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Local access -->
  <rect x="1020" y="640" width="290" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="1165" y="670" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">Local UI access</text>
  <text x="1165" y="692" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">kubectl port-forward :8080</text>
  <text x="1165" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">No public load balancer (demo)</text>

  <text x="700" y="860" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">DAGs baked into Docker image (*.py) · Bootstrap → Deploy Infra → Deploy Airflow → Destroy</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
